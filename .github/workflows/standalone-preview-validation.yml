name: Standalone Preview Validation

on:
  push:
    branches:
      - feature/corp-runtime-vercel-route-20261003
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:standalone
      - name: Verify owned runtime artifacts
        run: |
          test -f .standalone/api/runtime.mjs
          test -f .standalone/server.mjs
          test -f .standalone/dependency-audit.json
          test -f .standalone/dist/index.html
      - name: Package validated owned runtime
        uses: actions/upload-artifact@v4
        with:
          name: strategic-minds-owned-runtime
          path: .standalone/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
